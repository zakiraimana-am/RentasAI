services:
  - type: web
    name: rentasai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_DEFAULT_MODE
        value: hybrid
      - key: ENABLE_LIVE_APIS
        value: true
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
