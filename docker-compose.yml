services:
  postgres:
    image: postgres:16
    container_name: rentasai-postgres
    environment:
      POSTGRES_DB: rentasai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rentasai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: rentasai-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rentasai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      APP_DEFAULT_MODE: hybrid
      ENABLE_LIVE_APIS: ${ENABLE_LIVE_APIS:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
